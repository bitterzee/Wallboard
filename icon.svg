      <stop offset="0" stop-color="#25423f"/>
      <stop offset="1" stop-color="#0f1b1d"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d3dc"/>
      <stop offset="1" stop-color="#a9b6c3"/>
