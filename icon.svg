  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ears -->
  <ellipse cx="128" cy="250" rx="98" ry="112" fill="url(#skin)"/>
  <ellipse cx="384" cy="250" rx="98" ry="112" fill="url(#skin)"/>
  <ellipse cx="136" cy="256" rx="64" ry="78" fill="#f2b5c4"/>
  <ellipse cx="376" cy="256" rx="64" ry="78" fill="#f2b5c4"/>
