  <path d="M226 318 C222 372 236 410 270 424 C300 436 330 420 332 394 C334 376 318 366 306 374 C298 380 302 392 296 398 C284 408 262 394 262 362 L264 318 Z" fill="url(#skin)"/>
  <path d="M244 352 q10 4 20 0 M242 376 q11 5 22 0" stroke="#93a1af" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="204" cy="262" rx="15" ry="19" fill="#22303a"/>
  <ellipse cx="308" cy="262" rx="15" ry="19" fill="#22303a"/>
  <circle cx="209" cy="255" r="5.5" fill="#fff"/>
  <circle cx="313" cy="255" r="5.5" fill="#fff"/>
  <!-- cheeks -->
